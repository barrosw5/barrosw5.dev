name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs of the same PR when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  web:
    # The name is a required check in branch protection: renaming it would
    # leave PRs waiting for a check that never comes
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Stories run as tests in a real browser (@storybook/addon-vitest)
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      # A broken story (bad import, wrong props) fails here, not in a demo
      - run: pnpm build-storybook --quiet

  e2e:
    # Also a required check: keep the name in sync with branch protection
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The three engines: Chromium (Chrome, Edge, Android), Firefox and
      # WebKit (Safari, every iPhone browser), with their system libraries
      - name: Install browsers for Playwright
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # playwright.config.ts builds the site and serves it on port 3123
      - run: pnpm test:e2e
      # When something fails, keep the report (screenshots, traces) to
      # download from the run's page
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
