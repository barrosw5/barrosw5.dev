name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs of the same PR when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  web:
    # The name is a required check in branch protection: renaming it would
    # leave PRs waiting for a check that never comes
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Stories run as tests in a real browser (@storybook/addon-vitest)
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      # A broken story (bad import, wrong props) fails here, not in a demo
      - run: pnpm build-storybook --quiet

  e2e:
    # Also a required check: keep the name in sync with branch protection
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's official image: the three browsers (Chromium, Firefox,
    # WebKit) and all their system libraries are already installed, so
    # nothing is downloaded from apt on every run (that took minutes and
    # once hung for 20). The tag MUST match the @playwright/test version in
    # package.json: when Dependabot bumps Playwright, bump it here too.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # The runner's user, so files in the checkout stay writable (and
      # Firefox doesn't refuse to start as root with a foreign HOME)
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Safety net for when package.json gets ahead of the image tag: with
      # matching versions this finds the image's browsers and does nothing;
      # otherwise it downloads just the browsers (not the system libraries)
      - name: Check the browsers match Playwright's version
        run: pnpm exec playwright install chromium firefox webkit
      # playwright.config.ts builds the site and serves it on port 3123
      - run: pnpm test:e2e
      # When something fails, keep the report (screenshots, traces) to
      # download from the run's page
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
